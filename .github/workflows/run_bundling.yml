name: Build Windows x86_64
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    types:
    - labeled
    - synchronize
permissions:
  actions: write
jobs:
  bundle_windows_x86_64:
    if: |-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push') ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 8
      CARGO_HOME: D:/.cargo
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: D:/.sccache
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
      ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
      ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      FILE_DIGEST: SHA256
      TIMESTAMP_DIGEST: SHA256
      TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 1
    - name: steps::install_sccache
      uses: taiki-e/install-action@v2
      with:
        tool: sccache@0.9.1
    - name: steps::restore_sccache_cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: D:/.sccache
        key: sccache-windows-x86_64-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          sccache-windows-x86_64-${{ runner.os }}-main
          sccache-windows-x86_64-${{ runner.os }}-
    - name: steps::setup_sentry
      uses: matbour/setup-sentry-cli@3e938c54b3018bdd019973689ef984e033b0454b
      with:
        token: ${{ secrets.SENTRY_AUTH_TOKEN }}
    - name: steps::clear_target_dir_if_large
      run: ./script/clear-target-dir-if-larger-than.ps1 350 200
      shell: pwsh
    - name: steps::enable_long_paths
      run: |
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        git config --system core.longpaths true
      shell: pwsh
    - name: bundle_windows_x86_64::bundle_windows
      run: script/bundle-windows.ps1 -Architecture x86_64
      env:
        CI: ${{ secrets.AZURE_SIGNING_TENANT_ID && 'true' || '' }}
      shell: pwsh
    - name: bundle_windows_x86_64::create_portable_zip
      run: |
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue inno\x86_64\Messages
        Remove-Item -Force -ErrorAction SilentlyContinue inno\x86_64\*.ico
        Remove-Item -Force -ErrorAction SilentlyContinue inno\x86_64\sign.ps1
        Remove-Item -Force -ErrorAction SilentlyContinue inno\x86_64\zed.iss
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue inno\x86_64\tools
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue inno\x86_64\arm64
        Set-Location inno\x86_64
        & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=9 ..\..\target\Zed-x86_64-portable.zip *
      shell: pwsh
    - name: bundle_windows_x86_64::upload_portable_zip
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Zed-x86_64-portable.zip
        path: target/Zed-x86_64-portable.zip
        if-no-files-found: error
    - name: bundle_windows_x86_64::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Zed-x86_64.exe
        path: target/Zed-x86_64.exe
        if-no-files-found: error
    - name: bundle_windows_x86_64::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zed-remote-server-windows-x86_64.zip
        path: target/zed-remote-server-windows-x86_64.zip
        if-no-files-found: error
    - name: bundle_windows_x86_64::save_sccache_cache
      if: always()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: D:/.sccache
        key: sccache-windows-x86_64-${{ runner.os }}-${{ github.sha }}
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 0
        keep_minimum_runs: 3
    timeout-minutes: 180
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
